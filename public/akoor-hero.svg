<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#c9b6a5"/><stop offset=".62" stop-color="#b69e89"/><stop offset="1" stop-color="#8c7867"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#b5a08a"/><stop offset="1" stop-color="#75604f"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7954e"/><stop offset=".28" stop-color="#a95e2c"/><stop offset=".6" stop-color="#6d371d"/><stop offset=".82" stop-color="#c17a3d"/><stop offset="1" stop-color="#6b351d"/></linearGradient>
 <linearGradient id="woodLight" x2="0" y2="1"><stop stop-color="#d99a59"/><stop offset=".5" stop-color="#9b5429"/><stop offset="1" stop-color="#61331f"/></linearGradient>
 <linearGradient id="linen" x2="0" y2="1"><stop stop-color="#fff8ed"/><stop offset=".55" stop-color="#e9dece"/><stop offset="1" stop-color="#c7b7a5"/></linearGradient>
